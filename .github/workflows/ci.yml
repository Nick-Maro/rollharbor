name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Initialize the original demo
        run: python tools/setup_demo.py
      - name: Validate the save
        run: python tools/dnd.py validate
      - name: Reject private runtime and credential files
        run: python tools/check_public.py
      - name: Run isolated unit and HTTP tests
        run: python -m unittest discover -s tests -q
      - name: Check JavaScript syntax
        shell: bash
        run: for file in web/*.js; do node --check "$file" || exit 1; done
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright shapely
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_dungeon_maps.py -q
      - run: python tests/browser_public_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-artifacts
          path: tests/.artifacts/
